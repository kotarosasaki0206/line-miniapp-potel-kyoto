<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#355a4a" />
  <title>梅小路ポテル京都｜チャット予約デモ</title>
  <link rel="stylesheet" href="/booking/styles.css" />
</head>
<body>
  <main class="phone-shell">
    <section class="booking-view" id="bookingView" aria-hidden="true">
      <header class="chat-header">
        <button id="closeBooking" class="icon-button" aria-label="戻る">‹</button>
        <div class="chat-brand"><div class="chat-avatar">P</div><div><strong>POTEL BOOKING DEMO</strong><span>梅小路ポテル京都・体験用チャット予約</span></div></div>
        <span class="demo-pill dark">DEMO</span>
      </header>
      <div class="progress" id="progress"><span class="active">01 <b>日程・人数</b></span><span>02 <b>お部屋・プラン</b></span><span>03 <b>予約確認</b></span></div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="composer-wrap">
        <form id="composer" class="composer"><textarea id="message" rows="1" placeholder="メッセージを入力" aria-label="メッセージ"></textarea><button class="send" type="submit" aria-label="送信">➤</button></form>
        <div class="composer-note">1予約1室・最大3名 / 非公式の体験デモです</div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="/booking/app.js" defer></script>
</body>
</html>
